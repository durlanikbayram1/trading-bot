name: Trading Bot
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # hafta içi, ABD borsa saatlerini kapsayan her 5 dk (UTC)
  workflow_dispatch:              # elle çalıştırma düğmesi
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Önceki durumu yükle
        uses: actions/cache@v4
        with:
          path: durum.json
          key: durum-${{ github.run_id }}
          restore-keys: durum-
      - name: Botu çalıştır
        run: python bot.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OTOMATIK: ${{ vars.OTOMATIK }}
      - name: Mini uygulamayı yayınla
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: always()
        uses: actions/deploy-pages@v4
